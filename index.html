<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>붕어빵 타이쿤</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9dfd0;min-height:100dvh;display:grid;place-items:center;padding:12px;font-family:system-ui,-apple-system,sans-serif;color:#49382d}#bbgame{background:#f6efe3;border:1px solid #dfd1bd;border-radius:20px;padding:15px;width:100%;max-width:560px;user-select:none;-webkit-user-select:none}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.small{font-size:10px;letter-spacing:2px;color:#92765d;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.stat{background:#fffaf1;border:1px solid #e6d9c7;padding:9px;border-radius:11px;text-align:center}.stat span{font-size:11px;color:#92765d;display:block}.stat b{font-size:23px;font-variant-numeric:tabular-nums}.orders{background:#fffaf1;border-radius:12px;padding:10px;margin-bottom:12px;border:1px solid #e6d9c7}.orderrow{display:flex;gap:7px;margin-top:7px}.ticket{flex:1;text-align:center;border:1px dashed #d9c5aa;border-radius:8px;padding:8px 2px;font-size:12px;font-weight:800}.ticket:first-child{background:#f9e5b8;border:1px solid #d9ad65}.stove{position:relative;background:#55504a;border:5px solid #71665b;border-radius:15px;padding:12px;box-shadow:0 5px 0 #c9b59d}.molds{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mold{position:relative;background:#292725;border:2px solid #80786c;border-radius:14px;color:#f5e7cf;padding:8px 4px 7px;min-width:0;overflow:hidden}.mold:active{transform:scale(.97)}.mold svg{width:100%;max-height:105px;display:block}.mold.ready{border-color:#f5c56a;box-shadow:inset 0 0 12px #d69d4144}.status{font-size:12px;font-weight:700;height:20px;white-space:nowrap}.meter{height:5px;border-radius:5px;background:#ffffff20;margin:4px 8px;overflow:hidden}.meter i{height:100%;display:block;width:0;background:#e8b65f;border-radius:5px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.tool{border:2px solid #ddcbb3;border-radius:12px;background:#fffaf1;color:#49382d;padding:10px;font-weight:800}.tool.selected{border-color:#a16b39;background:#f6dfbb;box-shadow:0 0 0 1px #a16b39}.ingredient{display:inline-block;width:19px;height:19px;border-radius:50%;vertical-align:middle;margin-right:6px}.hint{text-align:center;font-size:12px;min-height:34px;margin:12px 0 0;color:#82664d}.overlay{position:absolute;inset:0;z-index:5;background:#30271ff5;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;color:#fff3df;padding:16px;text-align:center}.overlay[hidden]{display:none}.overlay h2{font-size:25px;margin:5px 0 9px;letter-spacing:-1px}.overlay p{font-size:12px;line-height:1.7;margin:0 0 14px;color:#e9d6bd}.start{border:0;background:#f2c77e;color:#4b3220;font-weight:900;border-radius:10px;padding:12px 30px}.resultnum{font-size:48px;font-weight:900;line-height:1.1;margin:6px 0;color:#ffdc9c}.resultdetail{font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<main id="bbgame">
<div class="top"><div><div class="small">WINTER STREET FOOD</div><div class="brand">붕어빵 타이쿤</div></div><span style="font-size:23px">❄</span></div>
<div class="stats"><div class="stat"><span>남은 시간</span><b id="bbtime">60.0</b></div><div class="stat"><span>판매 개수</span><b id="bbscore">0</b></div><div class="stat"><span>매출</span><b id="bbmoney">0</b><span>원</span></div></div>
<div class="orders"><div style="font-size:11px;font-weight:800;color:#92765d">ORDER · 손님 주문</div><div class="orderrow" id="bborders"></div></div>
<div class="stove"><div class="molds" id="bbmolds"></div><div class="overlay" id="bboverlay"><svg width="116" height="66" viewBox="0 0 140 85"><path d="M103 28L132 12 127 42 132 72 103 56C78 87 12 77 8 43 9 7 78 0 103 28Z" fill="#dca05b" stroke="#9d6032" stroke-width="3"/><circle cx="30" cy="35" r="4" fill="#794821"/><path d="M43 21Q59 43 43 64M59 19Q76 42 59 66M77 20Q94 42 77 64" fill="none" stroke="#b8793c" stroke-width="2"/><path d="M14 47Q23 54 32 47" fill="none" stroke="#9d6032" stroke-width="2"/></svg><h2>붕어빵 가게 OPEN</h2><p>제한 시간 60초<br>팥 · 슈크림 · 피자 · 고구마<br>주문에 맞춰 붕어빵을 구워 판매하세요.</p><button class="start" id="bbstart">장사 시작</button></div></div>
<div class="tools"><button class="tool selected" data-flavor="red"><span class="ingredient" style="background:#80463e"></span>팥 앙금</button><button class="tool" data-flavor="cream"><span class="ingredient" style="background:#efd080;border:1px solid #d6b66b"></span>슈크림</button><button class="tool" data-flavor="pizza"><span class="ingredient" style="background:#d66b43;border:1px solid #b75232"></span>피자</button><button class="tool" data-flavor="sweet"><span class="ingredient" style="background:#c9a0c4;border:1px solid #a77aa4"></span>고구마</button></div>
<div class="hint" id="bbhint">빈 붕어빵 틀을 터치해 반죽을 넣으세요.</div>
</main>
<script>
(()=>{const root=document.getElementById('bbgame'),$=s=>root.querySelector(s),molds=$('#bbmolds'),overlay=$('#bboverlay');const menu={red:{name:'팥',color:'#80463e'},cream:{name:'슈크림',color:'#edc75c'},pizza:{name:'피자',color:'#d66b43'},sweet:{name:'고구마',color:'#c9a0c4'}};const name=f=>menu[f].name;let slots=[],orders=[],flavor='red',score=0,burned=0,wrong=0,active=false,startAt=0,frame=0;const fresh=()=>({stage:0,flavor:null,t:0});const flavors=Object.keys(menu);const randomFlavor=()=>flavors[Math.floor(Math.random()*flavors.length)];
function fish(s){let fill=['#373430','#f4dfb2','#f4dfb2','#e4b579','#c78a45','#372720'][s.stage],stroke=s.stage===0?'#68625b':s.stage===5?'#211915':'#a86e39';return `<svg viewBox="0 0 140 85" aria-hidden="true"><path d="M103 28L132 12 127 42 132 72 103 56C78 87 12 77 8 43 9 7 78 0 103 28Z" fill="${fill}" stroke="${stroke}" stroke-width="3"/><g fill="none" stroke="${stroke}" stroke-width="2" opacity=".75"><path d="M43 21Q59 43 43 64M59 19Q76 42 59 66M77 20Q94 42 77 64M110 31L125 24M110 53L125 60M14 47Q23 54 32 47"/><circle cx="30" cy="35" r="3.5"/></g>${s.stage===2?`<ellipse cx="66" cy="43" rx="26" ry="18" fill="${menu[s.flavor].color}" stroke="${stroke}" stroke-width="1.5"/>`:''}${s.stage===5?'<path d="M45 13Q32 0 43 -9M73 12Q60 0 72 -9" fill="none" stroke="#aaa" stroke-width="3"/>':''}</svg>`}
function drawOrders(){$('#bborders').innerHTML=orders.map((f,i)=>`<div class="ticket"><span style="font-size:10px;color:#987654">${i===0?'현재 주문':'대기 '+i}</span><br><span style="color:${menu[f].color}">●</span> ${name(f)} 1개</div>`).join('')}
function status(s,now){let elapsed=now-s.t;if(s.stage===0)return '반죽 넣기';if(s.stage===1)return '앙금 넣기';if(s.stage===2)return '반죽 덮기';if(s.stage===3)return elapsed>=2800?'지금 뒤집기!':'굽는 중…';if(s.stage===4)return elapsed>=2500?'판매하기!':'굽는 중…';return '탔어요 · 버리기'}
function drawSlot(i){const s=slots[i],b=molds.children[i];b.querySelector('.fish').innerHTML=fish(s);b.querySelector('.status').textContent=status(s,performance.now());b.querySelector('i').style.width='0%';b.classList.remove('ready')}
function build(){slots=Array.from({length:4},fresh);molds.innerHTML=slots.map((s,i)=>`<button class="mold" data-index="${i}"><div class="fish">${fish(s)}</div><div class="status">반죽 넣기</div><div class="meter"><i></i></div></button>`).join('')}
function hint(t){$('#bbhint').textContent=t}function stats(){$('#bbscore').textContent=score;$('#bbmoney').textContent=(score*1000).toLocaleString('ko-KR')}
function tap(i){if(!active)return;const now=performance.now();if(now-startAt>=60000){finish();return}let s=slots[i];if(s.stage===0){s.stage=1;hint('팥·슈크림·피자·고구마 중 선택하고 틀을 터치하세요.')}else if(s.stage===1){s.stage=2;s.flavor=flavor;hint(name(flavor)+'을 넣었어요. 한 번 더 눌러 반죽을 덮으세요.')}else if(s.stage===2){s.stage=3;s.t=now;hint('노란 테두리가 나타나면 뒤집으세요.')}else if(s.stage===3){if(now-s.t<2800){hint('아직 덜 익었어요!');return}if(now-s.t>=6200){s.stage=5;burned++;drawSlot(i);return}s.stage=4;s.t=now;hint('반대쪽도 노릇하게 구워 주세요.')}else if(s.stage===4){if(now-s.t<2500){hint('조금만 더 구워 주세요!');return}if(now-s.t>=5800){s.stage=5;burned++;drawSlot(i);return}if(s.flavor===orders[0]){score++;orders.shift();orders.push(randomFlavor());drawOrders();stats();hint('판매 완료! +1,000원')}else{wrong++;hint('주문과 다른 맛이에요. 판매 실패!')}slots[i]=fresh()}else{slots[i]=fresh();hint('새 반죽을 넣어 다시 구워 주세요.')}drawSlot(i)}
function tick(now){if(!active)return;const remain=Math.max(0,60-(now-startAt)/1000);$('#bbtime').textContent=remain.toFixed(1);if(remain<=0){finish();return}slots.forEach((s,i)=>{if(s.stage!==3&&s.stage!==4)return;let elapsed=now-s.t,ready=s.stage===3?2800:2500,limit=s.stage===3?6200:5800;if(elapsed>=limit){s.stage=5;burned++;drawSlot(i);hint('붕어빵이 탔어요!');return}const b=molds.children[i],bar=b.querySelector('i');b.querySelector('.status').textContent=status(s,now);b.classList.toggle('ready',elapsed>=ready);bar.style.width=Math.min(100,elapsed/limit*100)+'%';bar.style.background=elapsed>=ready?'#f8cb70':'#a5ae8a'});frame=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(frame);score=0;burned=0;wrong=0;active=true;flavor='red';root.querySelectorAll('.tool').forEach(x=>x.classList.toggle('selected',x.dataset.flavor===flavor));orders=Array.from({length:3},randomFlavor);build();drawOrders();stats();overlay.hidden=true;$('#bbtime').textContent='60.0';hint('빈 붕어빵 틀을 터치해 반죽을 넣으세요.');startAt=performance.now();frame=requestAnimationFrame(tick)}
function finish(){active=false;cancelAnimationFrame(frame);$('#bbtime').textContent='0.0';overlay.innerHTML=`<div style="font-size:10px;letter-spacing:3px;color:#e3c79e">WINTER STREET FOOD</div><h2>오늘의 장사 종료</h2><div class="resultnum">${score}개</div><div style="font-size:20px;font-weight:800;margin-bottom:10px">${(score*1000).toLocaleString('ko-KR')}원</div><div class="resultdetail">탄 붕어빵 ${burned}개 · 주문 실수 ${wrong}회</div><button class="start" id="bbstart">다시 장사하기</button>`;overlay.hidden=false;hint('장사가 끝났습니다.')}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='bbstart'){start();return}if(b.dataset.flavor){flavor=b.dataset.flavor;root.querySelectorAll('.tool').forEach(x=>x.classList.toggle('selected',x===b));return}if(b.dataset.index!==undefined)tap(Number(b.dataset.index))});build();orders=['red','pizza','sweet'];drawOrders()})();
</script>
</body>
</html>
